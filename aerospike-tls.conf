# Aerospike Enterprise Edition TLS/auth fixture for go-micro-aerospike
# secured tests. The eval feature key is baked into the enterprise image at
# /etc/aerospike/features.conf. Fixture-only credentials — never real secrets.
service {
	feature-key-file /etc/aerospike/features.conf
	user root
	group root
	cluster-name go-micro-tls-test
	pidfile /run/aerospike/asd.pid
	proto-fd-max 15000
}

logging {
	console {
		context any info
	}
}

security {
}

network {
	service {
		address any
		port 3000
		tls-address any
		tls-port 4333
		tls-name aerospike-tls
		tls-authenticate-client any
	}

	tls aerospike-tls {
		cert-file /opt/aerospike/certs/server.crt
		key-file /opt/aerospike/certs/server.key
		ca-file /opt/aerospike/certs/ca.crt
	}

	heartbeat {
		mode mesh
		port 3002
	}

	fabric {
		port 3001
	}
}

namespace test {
	replication-factor 1
	nsup-period 1
	default-ttl 0
	storage-engine memory {
		data-size 512M
	}
}

namespace test2 {
	replication-factor 1
	nsup-period 1
	default-ttl 0
	storage-engine memory {
		data-size 512M
	}
}
