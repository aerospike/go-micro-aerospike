# Aerospike Community Edition fixture for go-micro-aerospike tests.
# Two namespaces (the CE limit) so ported tests can exercise multiple Go
# Micro databases.
service {
	user root
	group root
	cluster-name go-micro-test
	pidfile /run/aerospike/asd.pid
	proto-fd-max 15000
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}
	heartbeat {
		mode mesh
		port 3002
	}
	fabric {
		port 3001
	}
}

# test carries a nonzero default-ttl so tests can prove that explicit
# non-expiry (TTLDontExpire) overrides the namespace default.
namespace test {
	replication-factor 1
	nsup-period 1
	default-ttl 30s
	storage-engine memory {
		data-size 512M
	}
}

namespace test2 {
	replication-factor 1
	nsup-period 1
	default-ttl 0
	storage-engine memory {
		data-size 512M
	}
}
